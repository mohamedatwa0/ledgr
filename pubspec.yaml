name: ledgr
description: "A personal finance tracker. Manual ledger entries, fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  go_router: ^14.8.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.5.0
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  flutter_tabler_icons: ^1.43.0
  package_info_plus: ^8.1.2
  crypto: ^3.0.6
  share_plus: ^10.1.4
  flutter_svg: ^2.1.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#FBF9F2"
  color_dark: "#081420"
  android: true
  ios: true
  web: false
  android_12:
    color: "#FBF9F2"
    color_dark: "#081420"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/ledger_icon.svg
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
